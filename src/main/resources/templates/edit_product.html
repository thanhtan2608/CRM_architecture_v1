<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chỉnh sửa sản phẩm</title>
    <style>
        .container { max-width: 600px; margin: 30px auto; font-family: Arial, sans-serif; padding: 25px; border: 1px solid #e0e0e0; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .btn-update { background: #ffc107; color: #000; padding: 12px 25px; border: none; cursor: pointer; border-radius: 5px; font-weight: bold; width: 100%; }
        .btn-update:hover { background: #e0a800; }
        .back-link { display: block; text-align: center; margin-top: 15px; color: #666; text-decoration: none; }
        .error-msg { color: #dc3545; font-size: 13px; margin-top: 5px; }
        .preview-img { margin-top: 10px; max-width: 100px; border-radius: 5px; display: block; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="color: #ffc107; text-align: center;">🛠 Chỉnh sửa sản phẩm</h2>
    <hr>

    <form th:action="@{/products/update/{id}(id=${product.id})}" th:object="${product}" method="post" enctype="multipart/form-data">


        <div class="form-group">
            <label>Mã sản phẩm </label>
            <input type="text" th:field="*{productCode}" readonly  style="background-color: #f8f9fa;" />
        </div>

        <div class="form-group">
            <label>Tên sản phẩm:</label>
            <input type="text" th:field="*{name}" />
            <p class="error-msg" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
        </div>

        <div class="form-group">
            <label>Giá bán (VNĐ):</label>
            <input type="number" th:field="*{price}" step="0.01" />
            <p class="error-msg" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></p>
        </div>

        <div class="form-group">
            <label>Loại sản phẩm:</label>
            <select th:field="*{typeId}">
                <option value="">-- Chọn loại sản phẩm --</option>
                <option th:each="type : ${listTypes}"
                        th:value="${type.id}"
                        th:text="${type.typeName}">
                </option>
            </select>
        </div>

        <div class="form-group">
            <label>Hình ảnh sản phẩm:</label>

            <div style="margin-bottom: 10px;">
                <p style="font-size: 0.85em; color: #666; margin-bottom: 5px;">Ảnh hiện tại:</p>
                <img th:if="${product.imageUrl != null && product.imageUrl != ''}"
                     th:src="@{'/uploads/' + ${product.imageUrl}}"
                     style="width: 120px; height: auto; border-radius: 5px; border: 1px solid #ddd; display: block;"
                     alt="Ảnh cũ">
                <span th:unless="${product.imageUrl != null && product.imageUrl != ''}"
                      style="color: #d9534f; font-style: italic;">Chưa có ảnh</span>
            </div>

            <input type="file" name="fileImage" id="fileImage" accept="image/*" onchange="previewImage(this)"/>

            <div id="newPreviewContainer" style="display: none; margin-top: 10px;">
                <p style="font-size: 0.85em; color: #28a745; margin-bottom: 5px;">Ảnh mới chọn:</p>
                <img id="newPreview" src="#" style="width: 120px; height: auto; border-radius: 5px; border: 2px dashed #28a745;"/>
            </div>
        </div>

        <script>
            function previewImage(input) {
                const previewContainer = document.getElementById('newPreviewContainer');
                const previewImg = document.getElementById('newPreview');

                if (input.files && input.files[0]) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        previewImg.src = e.target.result;
                        previewContainer.style.display = 'block';
                    }
                    reader.readAsDataURL(input.files[0]);
                } else {
                    previewContainer.style.display = 'none';
                }
            }
        </script>

        <div class="form-group">
            <label>Mô tả chi tiết:</label>
            <textarea th:field="*{description}" rows="5"></textarea>
        </div>

        <button type="submit" class="btn-update">CẬP NHẬT THAY ĐỔI</button>
    </form>

    <a th:href="@{/products}" class="back-link">⬅ Hủy và quay lại</a>
</div>

</body>
</html>
