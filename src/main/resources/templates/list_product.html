<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh sách sản phẩm</title>
    <style>
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #f4f4f4; }
        .btn { padding: 5px 10px; text-decoration: none; border-radius: 4px; display: inline-block; }
        .btn-add { background-color: #28a745; color: white; margin-bottom: 10px; }
        .btn-edit { background-color: #ffc107; color: black; }
        .btn-delete { background-color: #dc3545; color: white; }

        /* Navbar CSS */
        .navbar { background-color: #333; overflow: hidden; font-family: Arial, sans-serif; border-radius: 4px; }
        .navbar a { float: left; display: block; color: white; text-align: center; padding: 14px 20px; text-decoration: none; }
        .navbar a:hover { background-color: #ddd; color: black; }

        .dropdown { float: left; overflow: hidden; }
        .dropdown .dropbtn { font-size: 16px; border: none; outline: none; color: white; padding: 14px 20px; background-color: inherit; font-family: inherit; margin: 0; cursor: pointer; }
        .dropdown-content { display: none; position: absolute; background-color: #f9f9f9; min-width: 160px; box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2); z-index: 1; }
        .dropdown-content a { float: none; color: black; padding: 12px 16px; text-decoration: none; display: block; text-align: left; }
        .dropdown-content a:hover { background-color: #ddd; }
        .dropdown:hover .dropdown-content { display: block; }

        .btn-search { background-color: #007bff; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; }
        .btn-clear { background-color: #6c757d; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; text-decoration: none; }
   .page-link {
    padding: 8px 16px;
    border: 1px solid #dee2e6;
    color: #007bff;
    background-color: #fff;
    transition: all 0.2s;
    font-weight: 500;
}

.page-link:hover {
    background-color: #e9ecef;
    border-color: #dee2e6;
}

.page-link.active {
    z-index: 3;
    color: #fff;
    background-color: #007bff;
    border-color: #007bff;
}
    </style>
</head>
<body>

<div class="navbar">
    <a th:href="@{/products}">Trang chủ</a>
    <div class="dropdown">
        <button class="dropbtn">Sản phẩm ▾</button>
        <div class="dropdown-content">
            <a th:href="@{/products}">Tất cả sản phẩm</a>
            <hr style="margin: 0; border: 0.5px solid #eee;">
            <a th:href="@{/product-types}">Danh mục</a>
        </div>
    </div>
</div>

<div style="padding: 20px;">
    <h2>Quản lý sản phẩm</h2>

    <form th:action="@{/products}" method="get" id="mainForm">

        <input type="hidden" name="sortField" th:value="${sortField}" />
        <input type="hidden" name="sortDir" th:value="${sortDir}" />

        <div style="margin-bottom: 20px; display: flex; gap: 10px; align-items: center;">
            <a th:href="@{/products/new}" class="btn btn-add" style="margin-bottom: 0;">Thêm sản phẩm mới</a>

            <input type="text" name="keyword" th:value="${keyword}"
                   placeholder="Tìm tên hoặc mã SP..."
                   style="padding: 8px; border: 1px solid #ddd; border-radius: 4px; width: 250px;" />

            <button type="submit" class="btn-search">🔍 Tìm kiếm</button>
            <a th:href="@{/products}" class="btn-clear">🧹 Xóa lọc</a>
        </div>

        <table>
            <thead>
            <tr>
                <th>Mã SP</th>
                <th>Hình ảnh</th>
                <th>Tên sản phẩm</th>
                <th style="min-width: 150px;">
                    <div style="display: flex; flex-direction: column; gap: 4px;">
                        <span>Loại sản phẩm</span>
                        <select name="typeId" onchange="this.form.submit()"
                                style="width: 100%; padding: 2px; font-size: 12px; border-radius: 4px; border: 1px solid #ddd;">
                            <option value="">-- Tất cả loại --</option>
                            <option th:each="type : ${listTypes}"
                                    th:value="${type.id}"
                                    th:text="${type.typeName}"
                                    th:selected="${type.id == selectedTypeId}">
                            </option>
                        </select>
                    </div>
                </th>
                <th>
                    <div style="display: flex; align-items: center; justify-content: space-between;">
                        <span>Giá</span>
                        <div style="display: flex; flex-direction: column; line-height: 1;">
                            <a th:href="@{/products(sortField='price', sortDir='asc', keyword=${keyword}, typeId=${selectedTypeId})}"
                               th:style="${sortField == 'price' && sortDir == 'asc' ? 'color: #ffc107;' : 'color: #ccc;'}">▲</a>
                            <a th:href="@{/products(sortField='price', sortDir='desc', keyword=${keyword}, typeId=${selectedTypeId})}"
                               th:style="${sortField == 'price' && sortDir == 'desc' ? 'color: #ffc107;' : 'color: #ccc;'}">▼</a>
                        </div>
                    </div>
                </th>
                <th>Mô tả</th>
                <th>
                    <div style="display: flex; align-items: center; justify-content: space-between;">
                        <span>Ngày tạo</span>
                        <div style="display: flex; flex-direction: column; line-height: 1;">
                            <a th:href="@{/products(sortField='createdAt', sortDir='asc', keyword=${keyword}, typeId=${selectedTypeId})}"
                               th:style="${sortField == 'createdAt' && sortDir == 'asc' ? 'color: #28a745;' : 'color: #ccc;'}">▲</a>
                            <a th:href="@{/products(sortField='createdAt', sortDir='desc', keyword=${keyword}, typeId=${selectedTypeId})}"
                               th:style="${sortField == 'createdAt' && sortDir == 'desc' ? 'color: #28a745;' : 'color: #ccc;'}">▼</a>
                        </div>
                    </div>
                </th>
                <th>
                    <div style="display: flex; align-items: center; justify-content: space-between;">
                        <span>Ngày cập nhật</span>
                        <div style="display: flex; flex-direction: column; line-height: 1;">
                            <a th:href="@{/products(sortField='updatedAt', sortDir='asc', keyword=${keyword}, typeId=${selectedTypeId})}"
                               th:style="${sortField == 'updatedAt' && sortDir == 'asc' ? 'color: #007bff;' : 'color: #ccc;'}">▲</a>
                            <a th:href="@{/products(sortField='updatedAt', sortDir='desc', keyword=${keyword}, typeId=${selectedTypeId})}"
                               th:style="${sortField == 'updatedAt' && sortDir == 'desc' ? 'color: #007bff;' : 'color: #ccc;'}">▼</a>
                        </div>
                    </div>
                </th>
                <th>Thao tác</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${listProducts}">
                <td th:text="${p.productCode}"></td>
                <td>
                    <img th:if="${p.imageUrl != null && p.imageUrl != ''}"
                         th:src="@{'/uploads/' + ${p.imageUrl}}"
                         style="width: 80px; height: auto; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);"
                         alt="Product Image"/>

                    <span th:unless="${p.imageUrl != null && p.imageUrl != ''}"
                          style="color: #ccc; font-style: italic;">
        No Image
    </span>
                </td>
                <td th:text="${p.name}"></td>

                <td th:text="${p.typeName != null ? p.typeName : 'Chưa phân loại'}"></td>
                <td th:text="${#numbers.formatDecimal(p.price * 1000, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'"></td>

                <td th:text="${p.description}"></td>

                <td th:text="${p.createdAt}"></td>
                <td th:text="${p.updatedAt}"></td>

                <td>
                    <a th:href="@{/products/edit/{id}(id=${p.id})}" style="background-color: #ffc107; color: black; padding: 5px 10px; text-decoration: none; border-radius: 4px;">Sửa</a>

                    <a th:href="@{/products/delete/{id}(id=${p.id})}"
                       onclick="return confirm('Bạn có chắc chắn muốn xóa sản phẩm này không?');"
                       style="background-color: #dc3545; color: white; padding: 5px 10px; text-decoration: none; border-radius: 4px; margin-left: 5px;">
                        Xóa
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </form>
</div>
<div class="pagination" style="display: flex; justify-content: center; align-items: center; gap: 5px; margin-top: 20px; flex-wrap: wrap;">

    <a th:if="${currentPage > 1}"
       th:href="@{/products(page=1, keyword=${keyword}, typeId=${typeId}, sortField=${sortField}, sortDir=${sortDir})}"
       class="page-link">⏮ Đầu</a>

    <span th:if="${currentPage > 3}">...</span>

    <th:block th:each="i : ${#numbers.sequence(1, totalPages)}">
        <a th:if="${i >= currentPage - 2 && i <= currentPage + 2}"
           th:href="@{/products(page=${i}, keyword=${keyword}, typeId=${typeId}, sortField=${sortField}, sortDir=${sortDir})}"
           th:text="${i}"
           th:class="${i == currentPage ? 'page-link active' : 'page-link'}"
           style="padding: 8px 12px; border: 1px solid #ddd; text-decoration: none; border-radius: 4px;"
           th:styleappend="${i == currentPage ? 'background-color: #007bff; color: white;' : 'color: #007bff;'}">
        </a>
    </th:block>

    <span th:if="${currentPage < totalPages - 2}">...</span>

    <a th:if="${currentPage < totalPages}"
       th:href="@{/products(page=${totalPages}, keyword=${keyword}, typeId=${typeId}, sortField=${sortField}, sortDir=${sortDir})}"
       class="page-link">Cuối ⏭</a>

</div>

</body>
</html>
